name: Flutter quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Temporary export aid: capture the SDK's exact formatter output so it
      # can be committed as source, rather than weakening the format gate.
      - name: Format workspace for remediation export
        run: dart format .

      - name: Export formatted Dart source
        uses: actions/upload-artifact@v4
        with:
          name: dart-formatted-source
          path: |
            lib/
            test/
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded
