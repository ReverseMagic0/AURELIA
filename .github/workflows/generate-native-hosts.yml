name: Generate native hosts

on:
  push:
    branches:
      - foundation/phase-01-quality-baseline

permissions:
  contents: write

concurrency:
  group: native-host-generation-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Android and iOS host projects
    if: \${{ !hashFiles('android/build.gradle*', 'ios/Runner.xcodeproj/project.pbxproj') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Generate native host projects in isolation
        run: |
          flutter create \
            --platforms=android,ios \
            --org dev.aurelia \
            --project-name aurelia_foundation \
            --no-pub \
            "$RUNNER_TEMP/aurelia_native"
          cp -a "$RUNNER_TEMP/aurelia_native/android" ./android
          cp -a "$RUNNER_TEMP/aurelia_native/ios" ./ios
          cp "$RUNNER_TEMP/aurelia_native/.metadata" ./.metadata

      - name: Verify source and tests remain healthy
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Commit generated host projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          if git diff --cached --quiet; then
            echo "No native host changes to commit."
            exit 0
          fi
          git commit -m "build: generate Android and iOS host projects"
          git push
